# Bench "test_board": UDS on the PT-CAN bus, classic CAN at 500 kbit/s.
#   ecu-can uds shell --ecu profiles/test_board.toml scripts/test_board_readonly.uds
# The simulator answers the same way:
#   ecu-can uds simulate --board test_board --interface virtual --channel tb

[bus]
interface = "pcan"
channel = "PCAN_USBBUS2"    # the USB-CANFD adapter on PT-CAN
bitrate = 500000
fd = false

[isotp]
tx_id = 0x60A               # physical requests
rx_id = 0x68A               # responses (also to functional requests)
functional_id = 0x601       # functional requests, single frame only
padding = 0xAA
stmin = 0
blocksize = 0

[uds]
timeout = 2.0               # P2* of the board is 2 s
keep_alive = 2.0            # S3 is 5 s: send TesterPresent well inside it

[security]
algorithm = "aes128-ecb"
# The secret key is never stored in this repository. Set ECU_COMM_SECURITY_KEY,
# pass --key-file, or point key_file at a file outside the repository
# (a relative path is resolved against this profile's folder):
# key_file = "../../keys/test_board.key"

# Named DIDs: read-did and write-did take these names, and read-did shows the fields.
# Numbers are big-endian. List them with: ecu-can uds dids --ecu profiles/test_board.toml
[dids.0xF110]
name = "CalibrationVersion"
fields = [{ name = "Major", type = "uint8" }, { name = "Minor", type = "uint8" }, { name = "Patch", type = "uint8" }]

[dids.0xF111]
name = "BootloaderVersion"
fields = [{ name = "Major", type = "uint8" }, { name = "Minor", type = "uint8" }, { name = "Patch", type = "uint8" }]

[dids.0xF112]
name = "HardwareVersion"
fields = [{ name = "Major", type = "uint8" }, { name = "Minor", type = "uint8" }, { name = "Patch", type = "uint8" }]

[dids.0xF183]
name = "BootFingerprint"
fields = [{ name = "Fingerprint", type = "ascii", length = 12 }]

[dids.0xF184]
name = "AppFingerprint"
fields = [{ name = "Fingerprint", type = "ascii", length = 12 }]

[dids.0xF186]
name = "ActiveSession"
fields = [{ name = "Session", type = "uint8", choices = { 1 = "default", 2 = "programming", 3 = "extended" } }]

[dids.0xF189]
name = "SoftwareVersion"
fields = [{ name = "Major", type = "uint8" }, { name = "Minor", type = "uint8" }, { name = "Patch", type = "uint8" }]

[dids.0xF18C]
name = "SerialNumber"
fields = [{ name = "Serial", type = "ascii", length = 12 }]

[dids.0xF190]
name = "VIN"
fields = [{ name = "VIN", type = "ascii", length = 17 }]

[dids.0xF195]
name = "SupplierSoftwareVersion"
fields = [{ name = "Major", type = "uint8" }, { name = "Minor", type = "uint8" }, { name = "Patch", type = "uint8" }]

[dids.0xF1A0]
name = "ActiveImage"
fields = [{ name = "Image", type = "uint8", choices = { 2 = "application" } }]

[dids.0xF1A1]
# What the bootloader saw and decided at its last boot, left in RAM that survives a reset.
# Valid only when Magic holds the bootloader's marker; all zeros: no record.
name = "BootInfo"
fields = [
    { name = "Magic", type = "uint32", display = "hex" },
    { name = "RequestMagic", type = "uint32", display = "hex" },
    { name = "RequestValue", type = "uint32", display = "hex" },
    { name = "RequestCheck", type = "uint32", display = "hex" },
    { name = "ResetCauseDes", type = "uint32", display = "hex" },
    { name = "ResetCauseFes", type = "uint32", display = "hex" },
    { name = "ImageMarker", type = "uint32", display = "hex" },
    { name = "ImageSp", type = "uint32", display = "hex" },
    { name = "ImageResetVector", type = "uint32", display = "hex" },
    { name = "RequestValid", type = "uint32", choices = { 0 = "no", 1 = "yes" } },
    { name = "ImageValid", type = "uint32", choices = { 0 = "no", 1 = "yes" } },
    { name = "Decision", type = "uint32", choices = { 0 = "none", 1 = "jumped-to-app", 2 = "stayed-in-bootloader" } },
]

[dids.0xFD10]
name = "PhaseCurrents"
fields = [
    { name = "U", type = "int16", scale = 0.1, unit = "A" },
    { name = "V", type = "int16", scale = 0.1, unit = "A" },
    { name = "W", type = "int16", scale = 0.1, unit = "A" },
]

[dids.0xFD11]
name = "SensorAddresses"
fields = [
    { name = "U", type = "uint8" },
    { name = "V", type = "uint8" },
    { name = "W", type = "uint8" },
    { name = "Found", type = "uint8", choices = { 0 = "no", 1 = "yes" } },
]
