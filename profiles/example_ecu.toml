# Example ECU profile for `ecu-can --ecu profiles/example_ecu.toml ...`.
# Copy this file for each ECU and adjust it. Command-line options override it.

[bus]
interface = "pcan"          # "virtual" or "pcan"
channel = "PCAN_USBBUS1"
bitrate = 500000
fd = false
# data_bitrate = 2000000    # CAN-FD only
# nominal_sample_point = 80
# data_sample_point = 75

[isotp]
tx_id = 0x7E0               # physical request ID (tester -> ECU)
rx_id = 0x7E8               # response ID (ECU -> tester)
extended = false            # true for 29-bit IDs
fd = false                  # true to carry ISO-TP in FD frames (needs bus.fd = true)
brs = false
padding = 0xCC              # false to send unpadded frames
stmin = 0
blocksize = 0

[uds]
timeout = 2.0               # seconds per request

# [dbc]
# files = ["test_board.dbc"]  # for listen and dbc show; relative to this profile's folder.
#                             # Keep company DBC files outside the repository and give their full path.

# Named DIDs: read-did and write-did accept the names, and read-did decodes the fields.
# Types: uint8/16/24/32, int8/16/24/32 (big-endian), ascii and bytes (with a length; the
# last field may leave it out to take the rest). List them: ecu-can uds dids --ecu PROFILE
