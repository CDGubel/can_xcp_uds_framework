[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "can-xcp-uds-framework"
version = "0.2.0"
description = "ECU-independent CAN, CAN-FD, ISO-TP and UDS communication for bench development"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-can>=4.6.1,<5",
    "can-isotp>=2.0.7,<3",
    "udsoncan>=1.26.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ecu-can = "ecu_comm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
