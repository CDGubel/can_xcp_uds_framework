[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "can-xcp-uds-framework"
version = "0.4.0"
description = "ECU-independent CAN, CAN-FD, ISO-TP, UDS and DBC tools for bench development"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-can[pcan]>=4.6.1,<5",   # [pcan] adds uptime: PEAK timestamps in wall-clock time
    "can-isotp>=2.0.7,<3",
    "udsoncan>=1.26.1,<2",
    "cantools>=45.2,<46",
]

[project.optional-dependencies]
security = ["cryptography>=43"]
dev = ["pytest>=8,<10", "cryptography>=43"]

[project.scripts]
ecu-can = "ecu_comm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
